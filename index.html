    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is your laboratory SANAS accredited?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Dielectric Fluid Solutions is accredited by the South African National Accreditation System (SANAS) under ISO/IEC 17025:2017, facility number T1060. This accreditation confirms our technical competence, impartiality, and consistent operation to internationally recognised standards."
          }
        },
        {
          "@type": "Question",
          "name": "Is your lab associated with any other company, or wholly independent?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We are wholly independent. We are not owned by, nor commercially linked to, any oil supplier, transformer OEM, refurbisher or service provider — so the results we deliver carry no commercial bias."
          }
        },
        {
          "@type": "Question",
          "name": "Do you test samples from across the African continent?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We routinely receive and test samples couriered in from outside South Africa. Get in touch with sample volumes, voltage class and origin and we will advise on the best sampling kit and courier route."
          }
        },
        {
          "@type": "Question",
          "name": "Do we get online access to our reports?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Clients receive online access to their report archive — historical results, trend graphs and downloadable PDFs — alongside email delivery of each new report."
          }
        },
        {
          "@type": "Question",
          "name": "Where is your laboratory located?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our laboratory is located at Unit 2, Protea Industrial Park, Protea Street, Aureus, Randfontein, Gauteng, South Africa. We serve clients across South Africa and the broader African continent."
          }
        },
        {
          "@type": "Question",
          "name": "What is transformer oil testing and why does it matter on a mine?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transformer oil is both an insulator and a coolant. Once it absorbs moisture, oxidises, or starts breaking down from internal faults, the transformer is on borrowed time. Routine oil testing tells you the condition of the oil and gives early warning of faults inside the tank (overheating, partial discharge, arcing) — usually months before a trip or failure. On a mine, where an unplanned transformer failure can stop a shaft, mill or section, oil testing is the cheapest insurance you can buy."
          }
        },
        {
          "@type": "Question",
          "name": "Which standards do you test to?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We test to the standards a mining EE or COP will expect to see on the report: SANS 60422 / IEC 60422 (in-service mineral oil maintenance and condition limits), IEC 60156 (breakdown voltage), IEC 60814 (moisture by Karl Fischer), IEC 60567 / ASTM D3612 (DGA sampling and testing), IEC 60599 (DGA interpretation), and IEC 62535 / IEC 61619 (corrosive sulphur and PCB screening). The report references the exact clause used, so it stands up in an audit."
          }
        },
        {
          "@type": "Question",
          "name": "How often should we sample?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aligned with SANS 60422: critical or large units (≥ 5 MVA, shaft winders, mill drives, main intake transformers) should have DGA every 6 months and full oil quality annually. Standard distribution and section transformers need full oil quality and DGA at least annually. New or recently repaired units should be sampled at commissioning, again at 3 months, then on the routine cycle. Sample immediately after any electrical event (through-fault, lightning strike, protection operation, abnormal noise, gas relay alarm)."
          }
        },
        {
          "@type": "Question",
          "name": "How do I take a sample correctly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use the bottom drain valve for routine oil quality, and the dedicated DGA sampling point with a glass syringe or sealed metal can for DGA — plastic bottles let dissolved gases escape. Flush 1–2 litres before filling the sample container. Fill slowly to avoid bubbles; for DGA exclude all air. Sample with the transformer in service if safe to do so. Label immediately with site, transformer ID, serial number, MVA, voltage, top oil temperature, ambient, date, time, and sampler's name. Keep upright, out of direct sun, and courier within 48 hours."
          }
        },
        {
          "@type": "Question",
          "name": "How much oil do you need?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Routine oil quality: 1 litre in a clean amber glass bottle. DGA only: 50–100 ml in a glass syringe or sealed metal can. Full suite plus furans and PCB: 1.5 litres."
          }
        },
        {
          "@type": "Question",
          "name": "Is sampling safe with the transformer energised?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, provided the unit has a sampling valve designed for live sampling, the foreman has authorised it, the sampler is competent and wearing arc-rated PPE, and a second person is in attendance. If there is any doubt — gas relay alarm, recent fault, audible discharge, oil leaking — do not sample live. Isolate first."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between an oil quality test and DGA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oil quality tells you the condition of the oil itself — whether it is still a good insulator and coolant. DGA tells you what is happening inside the transformer by measuring the gases dissolved in the oil. You want both. Oil quality answers whether you must dry, filter or replace the oil; DGA answers whether the transformer is developing a fault."
          }
        },
        {
          "@type": "Question",
          "name": "What is in a standard oil quality report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A standard oil quality report covers breakdown voltage (BDV) for dielectric strength, moisture content by Karl Fischer in ppm, acidity in mg KOH/g, interfacial tension (IFT) for sludge precursors, dielectric dissipation factor (tan δ) for polar contaminants, colour as a quick visual ageing indicator, and flash point for volatile contamination. Each result is compared to SANS 60422 action limits for the correct voltage class."
          }
        },
        {
          "@type": "Question",
          "name": "What does the DGA tell me, in plain language?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Each gas points to a different fault: hydrogen indicates partial discharge or corona; methane and ethane indicate low-temperature thermal faults below 300 °C; ethylene indicates high-temperature thermal faults above 700 °C; acetylene indicates arcing and must be treated as serious; carbon monoxide and carbon dioxide indicate paper insulation degradation. The lab applies IEC 60599 ratios and the Duval triangle to classify the fault and recommends the next step."
          }
        },
        {
          "@type": "Question",
          "name": "What is a furan test and when do I need it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Furans (especially 2-FAL) come from the breakdown of the paper insulation on the windings, which cannot be replaced without rewinding. Order a furan test when the transformer is over 15 years old, when CO and CO₂ are climbing, or when you are deciding whether to refurbish or replace."
          }
        },
        {
          "@type": "Question",
          "name": "Do you test for PCBs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Any oil topped up before the late 1980s, or of unknown history, should be screened. We do an L2000 / GC screen and issue a certificate suitable for waste disposal and DMRE compliance."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Routine oil quality: 3–5 working days from receipt. DGA: 2–3 working days. Emergency or fault investigation: 24 hours, by arrangement, for a surcharge. Couriers from remote sites add 1–2 days."
          }
        },
        {
          "@type": "Question",
          "name": "How are results delivered?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PDF report by email, with raw data, comparison to SANS 60422 limits, trend graph against previous samples on the same unit, and a plain-language recommendation (continue service, re-sample, recondition, investigate, or remove from service). Clients also have online access to their full report archive."
          }
        },
        {
          "@type": "Question",
          "name": "The report says recondition the oil. What does that mean?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The oil itself is still serviceable but needs to be dried and filtered, typically by hot oil filtration / vacuum dehydration on site. The transformer doesn't have to be taken out of service for long. Reconditioning is far cheaper than an oil change."
          }
        },
        {
          "@type": "Question",
          "name": "The report says remove from service. What now?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "This is reserved for cases where the oil and/or the gas pattern indicate the transformer is unsafe to keep running — for example, rising acetylene, BDV well below limit with confirmed moisture, or a sudden DGA shift. Isolate the unit, do not energise, and call us. We will usually recommend an immediate re-sample to confirm, and an inspection by your transformer OEM or a qualified repairer."
          }
        },
        {
          "@type": "Question",
          "name": "Acetylene appeared in the latest DGA. Is the transformer about to explode?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not necessarily — but it has to be taken seriously. Acetylene means arcing somewhere in the tank. Re-sample within 24–48 hours to confirm the trend, reduce load if possible, check Buchholz / gas relay (do not reset without sampling the gas), and if acetylene is rising sample-to-sample, plan an outage."
          }
        },
        {
          "@type": "Question",
          "name": "How do I read the trend?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "What matters is the rate of change, not a single number. A unit with 25 ppm H₂ that has been sitting at 25 ppm for five years is far less concerning than one that went from 5 to 25 ppm in three months. Keep the historical samples on file and always send the previous report number with new samples so the trend can be plotted."
          }
        },
        {
          "@type": "Question",
          "name": "Can you sample on site?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We run scheduled site visits across Gauteng and to mines on request elsewhere in South Africa and the region. For a fleet of more than ten transformers, an on-site sampling and condition-monitoring contract usually works out cheaper than crew time, courier and sample kits combined."
          }
        }
      ]
    }
    </script>
